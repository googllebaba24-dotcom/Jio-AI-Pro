<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: transparent; 
            color: #00ff00; 
            font-family: monospace; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .circle-panel {
            width: 210px;
            height: 210px;
            background: rgba(8, 8, 8, 0.97);
            border-radius: 50%;
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(8, 8, 8, 0.97), rgba(8, 8, 8, 0.97)), linear-gradient(135deg, #00ff00, #ff0055, #00ffff);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 22px rgba(0, 255, 0, 0.6), inset 0 0 15px rgba(0, 255, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            animation: rotateGlow 6s linear infinite;
        }

        @keyframes rotateGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .title { 
            font-size: 11px; 
            font-weight: bold; 
            color: #ffcc00; 
            text-shadow: 0 0 5px #ffcc00; 
            margin-bottom: 2px;
        }
        
        .sub-title {
            font-size: 8px;
            color: #aaa;
            margin-bottom: 3px;
        }

        .result-box {
            font-size: 17px;
            font-weight: bold;
            color: yellow;
            text-shadow: 0 0 8px yellow;
            margin: 2px 0;
        }

        .number-box {
            font-size: 19px;
            font-weight: bold;
            color: cyan;
            text-shadow: 0 0 8px cyan;
        }

        .analytics-info {
            font-size: 7.5px;
            color: #00ff00;
            background: rgba(0, 255, 0, 0.08);
            border: 1px dashed #00ff00;
            padding: 2px 4px;
            border-radius: 4px;
            margin: 3px 0;
        }

        input { 
            width: 85%; 
            padding: 4px; 
            background: #000; 
            border: 1px solid #00ff00; 
            color: #00ff00; 
            font-family: monospace; 
            margin-bottom: 4px; 
            text-align: center; 
            font-size: 11px;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            width: 100%;
            justify-content: center;
            margin-top: 3px;
        }

        button { 
            background: #00ff00; 
            color: #000; 
            border: none; 
            padding: 4px 7px; 
            font-weight: bold; 
            font-size: 9.5px; 
            border-radius: 4px; 
            cursor: pointer;
            box-shadow: 0 0 5px #00ff00;
        }
        
        .hide-btn { background: #ffaa00; color: #000; }
        .close-btn { background: #cc0000; color: white; }

        #panel-content { display: none; width: 100%; }
        #auth-screen { width: 100%; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <div class="circle-panel">
        <!-- LOGIN SCREEN -->
        <div id="auth-screen">
            <div class="title">JIO AI VIP</div>
            <div class="sub-title">ENTER KEY</div>
            <input type="text" id="key-input" placeholder="SGOD2026" onfocus="Android.enableFocus()">
            <button onclick="verifyKey()">LOGIN</button>
            <div id="error-msg" style="color: #ff3333; font-size: 8px; margin-top: 2px;"></div>
        </div>

        <!-- MAIN CIRCULAR ANALYZER PANEL -->
        <div id="panel-content">
            <div class="title">JIO AI ANALYZER</div>
            <div class="sub-title">PER: <span id="period-num" style="color:cyan;">0000</span> | <span id="timer" style="color:#ff5555;">00:00</span></div>
            
            <div class="result-box" id="prediction">ANALYZING</div>
            <div style="font-size: 7.5px; color: #aaa;">LUCKY DIGIT</div>
            <div class="number-box" id="lucky-number">-</div>

            <div class="analytics-info" id="analytics-status">Smart Matrix Active</div>

            <div class="btn-group">
                <button class="hide-btn" onclick="Android.minimizePanel()">HIDE</button>
                <button class="close-btn" onclick="Android.closeApp()">EXIT</button>
            </div>
        </div>
    </div>

    <script>
        const VALID_KEY = "SGOD2026";
        let activePeriodId = "";
        let memoryLog = [];

        function verifyKey() {
            const userKey = document.getElementById('key-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (userKey === VALID_KEY) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                startEngine();
            } else {
                errorMsg.innerText = "❌ Invalid Key!";
            }
        }

        function startEngine() {
            function runClock() {
                const now = new Date();
                const year = now.getUTCFullYear();
                const month = String(now.getUTCMonth() + 1).padStart(2, '0');
                const day = String(now.getUTCDate()).padStart(2, '0');
                
                const hours = now.getUTCHours();
                const minutes = now.getUTCMinutes();
                const seconds = now.getUTCSeconds();

                const totalMinsToday = hours * 60 + minutes;
                const incrementalId = String(totalMinsToday).padStart(4, '0');
                const fullPeriodId = `${year}${month}${day}000${incrementalId}`;

                document.getElementById("period-num").innerText = fullPeriodId.slice(-5);

                let secLeft = 59 - (seconds % 60);
                let secStr = secLeft < 10 ? "0" + secLeft : secLeft;
                document.getElementById("timer").innerText = "00:" + secStr;

                if (fullPeriodId !== activePeriodId) {
                    activePeriodId = fullPeriodId;
                    calculateSmartPrediction(fullPeriodId);
                }
            }
            setInterval(runClock, 1000);
            runClock();
        }

        function stringHashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        }

        function calculateSmartPrediction(period) {
            let rawHash = Math.abs(stringHashCode(period));
            
            let correctionFactor = 0;
            if (memoryLog.length >= 3) {
                let lastThreeResults = memoryLog.slice(-3);
                let allBig = lastThreeResults.every(val => val === true);
                let allSmall = lastThreeResults.every(val => val === false);

                if (allBig) {
                    correctionFactor = -5;
                    document.getElementById('analytics-status').innerText = "Signal: Reversal Shift";
                } else if (allSmall) {
                    correctionFactor = 5;
                    document.getElementById('analytics-status').innerText = "Signal: Reversal Shift";
                } else {
                    document.getElementById('analytics-status').innerText = "Smart Matrix Active";
                }
            }

            let balancedValue = rawHash + correctionFactor;
            let isBig = balancedValue % 2 === 0;

            memoryLog.push(isBig);
            if (memoryLog.length > 10) memoryLog.shift();

            let resultText = isBig ? "BIG 🟢" : "SMALL 🔴";
            let luckyNum = isBig ? (5 + (balancedValue % 5)) : (balancedValue % 5);

            document.getElementById('prediction').innerText = resultText;
            document.getElementById('prediction').style.color = isBig ? "#00ff00" : "#ff3333";
            document.getElementById('lucky-number').innerText = luckyNum;
        }
    </script>
</body>
</html>

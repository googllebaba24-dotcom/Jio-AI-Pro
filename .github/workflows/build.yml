name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'

        - name: Setup Gradle
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v3
          with:
            gradle-version: '8.5'
            cache-disabled: true

        - name: Build APK
          run: gradle assembleDebug

        - name: Rename APK
          run: mv app/build/outputs/apk/debug/app-debug.apk Jio-AI-Pro.apk

        - name: Upload to Releases
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v1.0.${{ github.run_number }}
            name: Download Jio AI Pro APK
            files: Jio-AI-Pro.apk
